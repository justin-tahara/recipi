<!DOCTYPE html>
<!-- Hand-written fixture: what a link shortener serves an unknown client
     instead of an HTTP redirect: a meta refresh to the real page. -->
<html>
<head>
<meta http-equiv="refresh" content="0; URL='https://example.com/garlic-butter-shrimp/'">
<title>Redirecting…</title>
</head>
<body><a href="https://example.com/garlic-butter-shrimp/">Continue</a></body>
</html>
