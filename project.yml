name: Recipi
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  RecipiKit:
    path: Packages/RecipiKit

targets:
  Recipi:
    type: application
    platform: iOS
    sources:
      - Recipi
    dependencies:
      - package: RecipiKit
        product: RecipiKit
      - package: RecipiKit
        product: RecipiDesign
      - target: RecipiShare
    info:
      path: Recipi/Info.plist
      properties:
        CFBundleDisplayName: recipi
        # Only the system's HTTPS, so App Store uploads skip the export
        # compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSRemindersFullAccessUsageDescription: recipi adds your grocery list to Reminders.
        RecipiAppGroupID: $(RECIPI_APP_GROUP_ID)
        RecipiCloudKitContainerID: $(RECIPI_CLOUDKIT_CONTAINER_ID)
    entitlements:
      path: Recipi/Recipi.entitlements
      properties:
        com.apple.security.application-groups: [$(RECIPI_APP_GROUP_ID)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(RECIPI_CLOUDKIT_CONTAINER_ID)]
        aps-environment: $(RECIPI_APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RECIPI_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  RecipiShare:
    type: app-extension
    platform: iOS
    sources:
      - RecipiShare
    dependencies:
      - package: RecipiKit
        product: RecipiKit
      - package: RecipiKit
        product: RecipiDesign
    info:
      path: RecipiShare/Info.plist
      properties:
        CFBundleDisplayName: Save to recipi
        RecipiAppGroupID: $(RECIPI_APP_GROUP_ID)
        RecipiCloudKitContainerID: $(RECIPI_CLOUDKIT_CONTAINER_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Safari runs this script (RecipiShare/Resources/SafariPage.js)
            # in the shared page and gives the extension the loaded HTML.
            NSExtensionJavaScriptPreprocessingFile: SafariPage
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: RecipiShare/RecipiShare.entitlements
      properties:
        com.apple.security.application-groups: [$(RECIPI_APP_GROUP_ID)]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [$(RECIPI_CLOUDKIT_CONTAINER_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RECIPI_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1"

  # Hosted unit tests. They link against the app, so they also see
  # RecipiKit through it; linking the package again would duplicate the
  # SwiftData models.
  RecipiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RecipiTests
    dependencies:
      - target: Recipi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RECIPI_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  # UI tests launch the app with -ui-testing: an in-memory store and
  # fixture pages instead of the network.
  RecipiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RecipiUITests
    dependencies:
      - target: Recipi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RECIPI_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Recipi:
    build:
      targets:
        Recipi: all
        RecipiShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecipiTests
        - RecipiUITests
    archive:
      config: Release
