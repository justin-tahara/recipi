name: CI

# Parallel jobs, so a PR's checks finish in minutes: the RecipiKit tests, and
# one job per test shard below, each on its own runner (free for a public
# repo). Each shard builds the app for itself, arm64 only, while its
# simulator boots; that's quicker than handing one build around as an
# artifact. CI uses the same newest released Xcode as testflight.yml, so it
# tests the toolchain that ships.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: RecipiKit tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Test RecipiKit
        run: swift test --package-path Packages/RecipiKit

  test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Everything but the audits, so a new test class runs without a new row.
          - name: Unit and UI tests
            only: -skip-testing:RecipiUITests/AccessibilityAuditTests
          - name: Accessibility audit
            only: -only-testing:RecipiUITests/AccessibilityAuditTests/testMainScreensPassAccessibilityAudit
          - name: Accessibility audit (largest text)
            only: -only-testing:RecipiUITests/AccessibilityAuditTests/testMainScreensPassAccessibilityAuditAtLargestTextSize
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # Boots in the background while the app builds; the test step waits
      # for it to finish.
      - name: Start an iPhone simulator
        run: |
          udid="$(scripts/ci/pick-simulator.sh)"
          echo "SIMULATOR_UDID=${udid}" >> "$GITHUB_ENV"
          nohup xcrun simctl bootstatus "${udid}" -b > "${RUNNER_TEMP}/boot.log" 2>&1 &

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      # arm64 only: the runners are Apple silicon, and a generic Simulator
      # build would compile everything a second time for x86_64.
      - name: Build app, extension and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Recipi.xcodeproj \
            -scheme Recipi \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
          | { grep -E --line-buffered 'error:|\*\* TEST BUILD' || true; }

      - name: Run tests
        run: |
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b > /dev/null
          # shellcheck disable=SC2086 # ONLY holds -only-testing/-skip-testing flags
          xcodebuild test-without-building \
            -xctestrun "$(find build/DerivedData/Build/Products -maxdepth 1 -name '*.xctestrun' | head -1)" \
            -destination "id=${SIMULATOR_UDID}" \
            -resultBundlePath build/Results.xcresult \
            ${ONLY}
        env:
          ONLY: ${{ matrix.only }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}.xcresult
          path: build/Results.xcresult
          if-no-files-found: ignore
