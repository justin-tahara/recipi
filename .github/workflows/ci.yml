name: CI

# Two parallel jobs, so a PR's checks finish in minutes: the RecipiKit tests,
# and the app's unit and UI tests on a simulator (simulator-tests.yml, arm64
# only). The accessibility audits run nightly instead (accessibility-audit.yml).
# CI uses the same newest released Xcode as testflight.yml, so it tests the
# toolchain that ships.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: RecipiKit tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Test RecipiKit
        run: swift test --package-path Packages/RecipiKit

  # Every test but the accessibility audits, which run nightly on main and
  # on demand (accessibility-audit.yml). A new test class runs here as is.
  test:
    name: iOS
    uses: ./.github/workflows/simulator-tests.yml
    with:
      name: Unit and UI tests
      only: -skip-testing:RecipiUITests/AccessibilityAuditTests
