name: Accessibility audit

# Xcode's accessibility audit on the main screens, at the default text size
# and the largest one (RecipiUITests/AccessibilityAuditTests.swift). It takes
# several minutes on CI, so it runs nightly on main instead of on every PR.
# Before merging UI work, run it on the branch: Actions -> Accessibility audit
# -> Run workflow, or `gh workflow run accessibility-audit.yml --ref <branch>`.
on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # TEMPORARY branch only: app-store-screenshots.yml can't be dispatched
  # until it's on main, so this runs the same job for one check of PR #65.
  screenshots:
    name: App Store screenshots
    uses: ./.github/workflows/simulator-tests.yml
    with:
      name: App Store screenshots
      only: -only-testing:RecipiUITests/AppStoreScreenshotTests
      screenshots: true
