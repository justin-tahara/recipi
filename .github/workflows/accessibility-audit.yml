name: Accessibility audit

# Xcode's accessibility audit on the main screens, at the default text size
# and the largest one (RecipiUITests/AccessibilityAuditTests.swift). It takes
# several minutes on CI, so it runs nightly on main instead of on every PR.
# Before merging UI work, run it on the branch: Actions -> Accessibility audit
# -> Run workflow, or `gh workflow run accessibility-audit.yml --ref <branch>`.
on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Accessibility audit
            only: -only-testing:RecipiUITests/AccessibilityAuditTests/testMainScreensPassAccessibilityAudit
          - name: Accessibility audit (largest text)
            only: -only-testing:RecipiUITests/AccessibilityAuditTests/testMainScreensPassAccessibilityAuditAtLargestTextSize
    uses: ./.github/workflows/simulator-tests.yml
    with:
      name: ${{ matrix.name }}
      only: ${{ matrix.only }}
