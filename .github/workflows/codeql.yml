name: CodeQL

# Not on pull requests: tracing a Swift build takes 20+ minutes, and recipi has
# no server, accounts or secrets for a PR to expose. Every change is still
# scanned once it lands on main, and weekly for new queries.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # CodeQL traces this build, so it has to compile everything from
      # scratch: the app, the share extension and RecipiKit.
      - name: Build
        run: |
          xcodebuild build \
            -project Recipi.xcodeproj \
            -scheme Recipi \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
